version: "3.9"

services:

  # ==========================================================
  # MLFLOW
  # ==========================================================

  mlflow:

    image: python:3.11-slim

    container_name: flight_mlflow

    working_dir: /app

    volumes:
      - ./notebooks/mlflow.db:/app/mlflow.db
      - ./notebooks/mlruns:/app/mlruns

    ports:
      - "5000:5000"

    command: >
      sh -c "
      pip install --no-cache-dir mlflow==3.15.1 &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlruns
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
      "


  # ==========================================================
  # FASTAPI
  # ==========================================================

  api:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: flight_api

    ports:
      - "8000:8000"

    depends_on:
      - mlflow

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000


  # ==========================================================
  # STREAMLIT
  # ==========================================================

  streamlit:

    build:
      context: .
      dockerfile: data/streamlit_app/Dockerfile

    container_name: flight_streamlit

    ports:
      - "8501:8501"

    depends_on:
      - api

    environment:
      API_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000