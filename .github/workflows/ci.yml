name: CI - Flight Price Prediction MLOps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt

      - name: Start MLflow server
        run: |
          nohup mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///notebooks/mlflow.db \
            --default-artifact-root ./notebooks/mlruns \
            --allowed-hosts localhost:5000,127.0.0.1:5000 \
            > mlflow.log 2>&1 &

      - name: Start FastAPI server
        run: |
          nohup uvicorn api.app:app \
            --host 127.0.0.1 \
            --port 8000 \
            > fastapi.log 2>&1 &

      - name: Wait for FastAPI
        run: |
          python - <<'PY'
          import time
          import requests

          url = "http://127.0.0.1:8000/health"

          for i in range(30):
              try:
                  response = requests.get(url, timeout=2)
                  print(response.text)

                  if response.status_code == 200:
                      print("FastAPI is ready.")
                      break
              except requests.exceptions.RequestException:
                  pass

              time.sleep(2)
          else:
              print("FastAPI failed to start.")
              print("\n--- MLflow log ---")
              print(open("mlflow.log").read())
              print("\n--- FastAPI log ---")
              print(open("fastapi.log").read())
              raise SystemExit(1)
          PY

      - name: Run API tests
        run: |
          pytest -v tests/test_api.py