name: CI - Flight Price Prediction MLOps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt


      # --------------------------------------------------
      # 4. Start MLflow server
      # --------------------------------------------------

      - name: Start MLflow server
        run: |
          mkdir -p "$GITHUB_WORKSPACE/notebooks/mlruns"

          nohup mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri "sqlite:///$GITHUB_WORKSPACE/notebooks/mlflow.db" \
            --default-artifact-root "file://$GITHUB_WORKSPACE/notebooks/mlruns" \
            --serve-artifacts \
            --allowed-hosts localhost:5000,127.0.0.1:5000,host.docker.internal:5000 \
            > mlflow.log 2>&1 &


      # --------------------------------------------------
      # 5. Wait for MLflow
      # --------------------------------------------------

      - name: Wait for MLflow
        run: |
          python - <<'PY'
          import time
          import requests

          url = "http://127.0.0.1:5000/"

          for i in range(30):
              try:
                  response = requests.get(
                      url,
                      timeout=2
                  )

                  print(
                      f"MLflow check {i + 1}: "
                      f"HTTP {response.status_code}"
                  )

                  if response.status_code == 200:
                      print("MLflow is ready.")
                      break

              except requests.exceptions.RequestException as e:
                  print(
                      f"Waiting for MLflow... "
                      f"attempt {i + 1}/30"
                  )

              time.sleep(2)

          else:
              print("MLflow failed to start.")

              print("\n--- MLflow log ---")
              print(open("mlflow.log").read())

              raise SystemExit(1)
          PY


      # --------------------------------------------------
      # 6. Register model in MLflow
      # --------------------------------------------------

      - name: Register model in MLflow
        run: |
          python scripts/register_model.py


      # --------------------------------------------------
      # 7. Start FastAPI server
      # --------------------------------------------------

      - name: Start FastAPI server
        run: |
          nohup uvicorn api.app:app \
            --host 127.0.0.1 \
            --port 8000 \
            > fastapi.log 2>&1 &


      # --------------------------------------------------
      # 8. Wait for FastAPI
      # --------------------------------------------------

      - name: Wait for FastAPI
        run: |
          python - <<'PY'
          import time
          import requests

          url = "http://127.0.0.1:8000/health"

          for i in range(30):
              try:
                  response = requests.get(
                      url,
                      timeout=2
                  )

                  print(
                      f"FastAPI check {i + 1}: "
                      f"{response.text}"
                  )

                  if response.status_code == 200:

                      data = response.json()

                      if data.get("status") == "healthy":

                          print(
                              "FastAPI is ready "
                              "and model is healthy."
                          )

                          break

              except requests.exceptions.RequestException as e:

                  print(
                      f"Waiting for FastAPI... "
                      f"attempt {i + 1}/30"
                  )

              time.sleep(2)

          else:

              print(
                  "FastAPI failed to become healthy."
              )

              print("\n--- MLflow log ---")
              print(open("mlflow.log").read())

              print("\n--- FastAPI log ---")
              print(open("fastapi.log").read())

              raise SystemExit(1)
          PY


      # --------------------------------------------------
      # 9. Run API tests
      # --------------------------------------------------

      - name: Run API tests
        run: |
          pytest -v tests/test_api.py


      # --------------------------------------------------
      # 10. Build Docker image
      # --------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t flight-price-api:ci \
            .


      # --------------------------------------------------
      # 11. Run Docker container
      # --------------------------------------------------

      - name: Run Docker container
        run: |
          docker run -d \
            --name flight_api_ci \
            --add-host=host.docker.internal:host-gateway \
            -p 8001:8000 \
            -e MLFLOW_TRACKING_URI=http://host.docker.internal:5000 \
            flight-price-api:ci


      # --------------------------------------------------
      # 12. Wait for Dockerized FastAPI
      # --------------------------------------------------

      - name: Wait for Dockerized FastAPI
        run: |
          python - <<'PY'
          import time
          import requests
          import subprocess

          url = "http://127.0.0.1:8001/health"

          for i in range(30):

              try:

                  response = requests.get(
                      url,
                      timeout=2
                  )

                  print(
                      f"Docker FastAPI check {i + 1}: "
                      f"{response.text}"
                  )

                  if response.status_code == 200:

                      data = response.json()

                      if data.get("status") == "healthy":

                          print(
                              "Dockerized FastAPI "
                              "is healthy."
                          )

                          break

              except requests.exceptions.RequestException as e:

                  print(
                      f"Waiting for Dockerized FastAPI... "
                      f"attempt {i + 1}/30"
                  )

              time.sleep(2)

          else:

              print(
                  "Dockerized FastAPI failed "
                  "to become healthy."
              )

              print(
                  "\n--- Docker container logs ---"
              )

              print(
                  subprocess.check_output(
                      [
                          "docker",
                          "logs",
                          "flight_api_ci"
                      ],
                      text=True
                  )
              )

              raise SystemExit(1)
          PY


      # --------------------------------------------------
      # 13. Run API tests against Docker container
      # --------------------------------------------------

      - name: Run API tests against Docker container
        env:
          API_URL: http://127.0.0.1:8001
        run: |
          pytest -v tests/test_api.py


      # --------------------------------------------------
      # 14. Stop Docker container
      # --------------------------------------------------

      - name: Stop Docker container
        if: always()
        run: |
          docker stop flight_api_ci || true
          docker rm flight_api_ci || true