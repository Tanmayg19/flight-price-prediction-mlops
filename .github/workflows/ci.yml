name: CI - Flight Price Prediction MLOps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt

      - name: Start MLflow server
        run: |
          nohup mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri sqlite:///notebooks/mlflow.db \
            --default-artifact-root ./notebooks/mlruns \
            --allowed-hosts localhost:5000,127.0.0.1:5000 \
            > mlflow.log 2>&1 &

      - name: Wait for MLflow
        run: |
          python - <<'PY'
          import time
          import requests

          url = "http://127.0.0.1:5000/"

          for i in range(30):
              try:
                  response = requests.get(url, timeout=2)

                  if response.status_code == 200:
                      print("MLflow is ready.")
                      break
              except requests.exceptions.RequestException:
                  pass

              time.sleep(2)
          else:
              print("MLflow failed to start.")
              print(open("mlflow.log").read())
              raise SystemExit(1)
          PY

      - name: Register model in MLflow
        run: |
          python scripts/register_model.py

      - name: Start FastAPI server
        run: |
          nohup uvicorn api.app:app \
            --host 127.0.0.1 \
            --port 8000 \
            > fastapi.log 2>&1 &

      - name: Wait for FastAPI
        run: |
          python - <<'PY'
          import time
          import requests

          url = "http://127.0.0.1:8000/health"

          for i in range(30):
              try:
                  response = requests.get(url, timeout=2)
                  print(response.text)

                  if response.status_code == 200:
                      data = response.json()

                      if data.get("status") == "healthy":
                          print("FastAPI is ready and model is healthy.")
                          break
              except requests.exceptions.RequestException:
                  pass

              time.sleep(2)
          else:
              print("FastAPI failed to become healthy.")

              print("\n--- MLflow log ---")
              print(open("mlflow.log").read())

              print("\n--- FastAPI log ---")
              print(open("fastapi.log").read())

              raise SystemExit(1)
          PY

      - name: Run API tests
        run: |
          pytest -v tests/test_api.py

      - name: Build Docker image
        run: |
          docker build -t flight-price-api:ci .

      - name: Run Docker container
        run: |
          docker run -d \
            --name flight_api_ci \
            --add-host=host.docker.internal:host-gateway \
            -p 8001:8000 \
            -e MLFLOW_TRACKING_URI=http://host.docker.internal:5000 \
            flight-price-api:ci

      - name: Wait for Dockerized FastAPI
        run: |
          python - <<'PY'
          import time
          import requests

          url = "http://127.0.0.1:8001/health"

          for i in range(30):
              try:
                  response = requests.get(url, timeout=2)
                  print(response.text)

                  if response.status_code == 200:
                      data = response.json()

                      if data.get("status") == "healthy":
                          print("Dockerized FastAPI is healthy.")
                          break
              except requests.exceptions.RequestException:
                  pass

              time.sleep(2)
          else:
              print("Dockerized FastAPI failed to become healthy.")

              print("\n--- Docker container logs ---")
              print(
                  __import__("subprocess")
                  .check_output(
                      ["docker", "logs", "flight_api_ci"],
                      text=True
                  )
              )

              raise SystemExit(1)
          PY

      - name: Run API tests against Docker container
	env: 
	  API_URL: http://127.0.0.1:8001
        run: |
          pytest -v tests/test_api.py

      - name: Stop Docker container
        if: always()
        run: |
          docker stop flight_api_ci || true
          docker rm flight_api_ci || true